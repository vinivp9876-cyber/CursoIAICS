<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o Personagem - Jujutsu Kaisen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            object-fit: cover;
        }

        #bg-fallback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background: #0a0a0f url('static/gojo-wallpaper.jpg') center/cover no-repeat;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            padding: 16px 20px 12px;
            text-align: center;
            background: linear-gradient(135deg, rgba(5,0,15,0.95), rgba(15,0,30,0.92));
            border-bottom: 2px solid rgba(120, 80, 255, 0.4);
            backdrop-filter: blur(16px);
            flex-shrink: 0;
        }

        header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #a78bfa, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        header h1 span {
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .game-info .lives {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #f87171;
        }

        .game-info .lives .heart {
            font-size: 16px;
        }

        .game-info .lives .count {
            background: rgba(239, 68, 68, 0.15);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .game-info .stats {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 12px;
        }

        .game-info .stats .wins {
            color: #34d399;
        }

        .game-info .stats .losses {
            color: #f87171;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar {
            width: 6px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(120, 80, 255, 0.3);
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: msgIn 0.25s ease-out;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-bottom-right-radius: 4px;
            color: #c4b5fd;
        }

        .message.user::before {
            content: "Você";
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.bot {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(30, 30, 50, 0.8), rgba(20, 20, 40, 0.7));
            border: 1px solid rgba(120, 80, 255, 0.2);
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }

        .message.bot::before {
            content: "Personagem";
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .message.bot.win {
            border-color: rgba(52, 211, 153, 0.4);
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.15), rgba(16, 185, 129, 0.08));
        }

        .message.bot.win::before {
            color: #34d399;
        }

        .message.bot.lose {
            border-color: rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(220, 38, 38, 0.08));
        }

        .message.bot.lose::before {
            color: #f87171;
        }

        .message.bot.system {
            border-color: rgba(251, 191, 36, 0.3);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(245, 158, 11, 0.05));
            text-align: center;
            max-width: 100%;
        }

        .message.bot.system::before {
            display: none;
        }

        .message .typing-dots {
            display: inline-flex;
            gap: 4px;
        }

        .message .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a78bfa;
            animation: typing 1.2s infinite;
        }

        .message .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .message .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1.2); }
        }

        #input-container {
            padding: 14px 20px 18px;
            background: linear-gradient(0deg, rgba(5,0,15,0.97) 0%, rgba(5,0,15,0.85) 100%);
            border-top: 1px solid rgba(120, 80, 255, 0.2);
            backdrop-filter: blur(16px);
            flex-shrink: 0;
        }

        #input-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #input-box input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(120, 80, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #input-box input:focus {
            border-color: rgba(120, 80, 255, 0.6);
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.08);
        }

        #input-box input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #input-box input:disabled {
            opacity: 0.4;
        }

        #input-box button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        #input-box button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
        }

        #input-box button:active:not(:disabled) {
            transform: translateY(0);
        }

        #input-box button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .welcome-msg {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.5);
        }

        .welcome-msg h2 {
            font-size: 18px;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
        }

        .welcome-msg p {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255,255,255,0.4);
        }

        .welcome-msg .hint {
            margin-top: 16px;
            padding: 12px 16px;
            background: rgba(120, 80, 255, 0.08);
            border: 1px solid rgba(120, 80, 255, 0.15);
            border-radius: 12px;
            display: inline-block;
            font-size: 12px;
            color: rgba(167, 139, 250, 0.6);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 18px; }
            .game-info { gap: 12px; font-size: 11px; flex-wrap: wrap; }
            .message { max-width: 92%; font-size: 13px; padding: 10px 14px; }
            #input-container { padding: 10px 14px 14px; }
            #input-box input { padding: 12px 14px; font-size: 14px; }
            #input-box button { padding: 12px 18px; font-size: 13px; }
            #chat-container { padding: 12px 14px; }
        }
    </style>
</head>
<body>
    <div id="bg-fallback"></div>
    <video id="bg-video" muted loop playsinline poster="static/gojo-wallpaper.jpg">
        <source src="static/gojo-wallpaper.mp4" type="video/mp4">
    </video>
    <div id="bg-overlay"></div>

    <div class="app-container">
        <header>
            <h1>Adivinhe o Personagem <span>- Jujutsu Kaisen</span></h1>
            <div class="game-info">
                <div class="lives">
                    <span class="heart">❤️</span>
                    <span class="count" id="lives-count">20</span>
                </div>
                <div class="stats">
                    <span class="wins" id="wins-count">✅ 0</span>
                    <span class="losses" id="losses-count">❌ 0</span>
                </div>
            </div>
        </header>

        <div id="chat-container">
            <div class="message bot system">
                🎯 Bem-vindo ao <strong>Adivinhe o Personagem - Jujutsu Kaisen</strong>!<br>
                A IA escolheu um personagem secreto. Faça perguntas para descobrir quem é!<br>
                Você tem <strong>20 perguntas</strong>. Boa sorte!
            </div>
        </div>

        <div id="input-container">
            <div id="input-box">
                <input type="text" id="user-input" placeholder="Faça uma pergunta ou tente adivinhar..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const livesCount = document.getElementById('lives-count');

        let gameOver = false;

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || gameOver) return;

            if (message.toLowerCase() === '/novo-jogo') {
                gameOver = false;
            }

            userInput.value = '';
            addMessage('user', message);

            const loadingId = addMessage('bot', '<div class="typing-dots"><span></span><span></span><span></span></div>');
            sendBtn.disabled = true;
            userInput.disabled = true;

            try {
                const response = await fetch('/pergunta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: message })
                });
                const data = await response.json();

                const loadingEl = document.getElementById(loadingId);
                const texto = data.resposta || data.erro || 'Erro desconhecido';

                let extraClass = '';
                if (data.acertou) {
                    extraClass = 'win';
                    gameOver = true;
                } else if (data.game_over) {
                    extraClass = 'lose';
                    gameOver = true;
                }

                loadingEl.outerHTML = `<div id="${loadingId}" class="message bot ${extraClass}">${texto}</div>`;

                if (data.vidas_restantes !== undefined) {
                    livesCount.textContent = data.vidas_restantes;
                }

                if (data.novo_jogo) {
                    livesCount.textContent = '20';
                }

                if (data.acertou || data.game_over) {
                    carregarEstatisticas();
                }

            } catch (error) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) {
                    loadingEl.outerHTML = `<div id="${loadingId}" class="message bot">Erro ao conectar com o servidor.</div>`;
                }
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function addMessage(role, content) {
            const id = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = id;
            div.innerHTML = content;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        async function carregarEstatisticas() {
            try {
                const resp = await fetch('/estatisticas');
                const data = await resp.json();
                if (data.vitorias !== undefined) {
                    document.getElementById('wins-count').textContent = `✅ ${data.vitorias}`;
                    document.getElementById('losses-count').textContent = `❌ ${data.derrotas}`;
                }
            } catch (_) {}
        }

        // Autoplay video background
        (function() {
            var video = document.getElementById('bg-video');
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function() {
                    document.addEventListener('click', function playOnClick() {
                        video.play();
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            }
        })();

        carregarEstatisticas();
        userInput.focus();
    </script>
</body>
</html>
