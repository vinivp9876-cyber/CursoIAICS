<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='56' rx='6' fill='%23667eea'/%3E%3Crect x='14' y='10' width='36' height='14' rx='3' fill='%23e0e0e0'/%3E%3Crect x='14' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='28' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='42' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='14' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='28' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='42' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="titulo-container">
            <img class="calc-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='56' rx='6' fill='%23667eea'/%3E%3Crect x='14' y='10' width='36' height='14' rx='3' fill='%23e0e0e0'/%3E%3Crect x='14' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='28' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='42' y='30' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='14' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='28' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3Crect x='42' y='42' width='8' height='8' rx='2' fill='%23fff' opacity='0.9'/%3E%3C/svg%3E" alt="Calculadora">
            <h1>Calculadora de Média</h1>
        </div>

        <p class="subtitulo">Informe seu nome e suas notas para saber se você foi aprovado</p>

        <div class="campo">
            <label for="nome">Nome do Aluno:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="campo">
            <label for="nota1">1ª Nota:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Digite a primeira nota">
        </div>

        <div class="campo">
            <label for="nota2">2ª Nota:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Digite a segunda nota">
        </div>

        <button id="btnCalcular">Calcular Média</button>

        <div id="resultado"></div>
    </div>

    <script src="squipt.js"></script>
</body>
</html>
